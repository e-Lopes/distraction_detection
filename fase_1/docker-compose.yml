version: '3.9'

services:
  monitoramento_app:
    build: .
    container_name: monitoramento_app
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix  # compartilhamento da GUI
    environment:
      - DISPLAY=${DISPLAY}
    network_mode: host  # necessário para interface Tkinter no Linux
