experiment_name: "classical_baselines_60"
window_size_frames: 60
seed: 42
xgb_device: "cuda"
models: [svm, random_forest, xgboost]
ablations: [facial_only, facial_plus_missingness, missingness_only]

parameters:
  svm:
    C: 1.0
    kernel: "rbf"
    class_weight: "balanced"
  random_forest:
    n_estimators: 300
    max_depth: null
    min_samples_leaf: 2
    class_weight: "balanced_subsample"
    n_jobs: -1
  xgboost:
    n_estimators: 500
    max_depth: 4
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    objective: "multi:softprob"
    eval_metric: "mlogloss"
    early_stopping_rounds: 30
    tree_method: "hist"
    n_jobs: -1

grid_search:
  svm:
    - C: [0.1, 1.0, 10.0]
      kernel: ["linear"]
      class_weight: ["balanced"]
    - C: [0.1, 1.0, 10.0]
      kernel: ["rbf"]
      gamma: ["scale", 0.1]
      class_weight: ["balanced"]
  random_forest:
    n_estimators: [200, 500]
    max_depth: [null, 8, 16]
    min_samples_leaf: [1, 3]
    max_features: ["sqrt", 0.8]
    class_weight: ["balanced_subsample"]
    n_jobs: [-1]
  xgboost:
    n_estimators: [300, 600]
    max_depth: [3, 5]
    learning_rate: [0.03, 0.1]
    subsample: [0.8]
    colsample_bytree: [0.8, 1.0]
    min_child_weight: [1, 5]
    objective: ["multi:softprob"]
    eval_metric: ["mlogloss"]
    early_stopping_rounds: [30]
    tree_method: ["hist"]
    n_jobs: [-1]
