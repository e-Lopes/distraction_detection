experiment_name: "g48_mediapipe_alternatives"
generation: "G48"
stage: "E1_preparation"
seed: 42
source_plan: "plano_experimento_alternativas_mediapipe.md"
schema: "fase_2/configs/features/g47_face_landmarks.yaml"

extractors:
  primary: [mediapipe_face_mesh, insightface, openface_2, mmpose_rtmw]
  efficiency_extension: [openseeface]
  conditional_extension: [yolo26_face_custom]

data:
  videos_manifest: "fase_2/data/manifests/videos.csv"
  intervals_manifest: "fase_2/data/manifests/annotation_frame_intervals.csv"
  roi_config: "fase_2/configs/preprocessing/legacy_roi.json"
  annotation_sample_min: 300
  annotation_sample_max: 600
  nme_primary_normalization: face_bbox_diagonal
  nme_secondary_normalization: interocular_distance

indicators:
  shared: [ear, mar, pitch, yaw, roll]
  head_pose_method: solvepnp_shared_six_points
  missing_value: nan

benchmark:
  devices: [cpu, "cuda:0"]
  repetitions: 5
  warmup_frames: 200
  visualization: false
  recording: false
  primary_latency_metric: p95_ms

downstream:
  models: [svm, lstm, tcn, transformer]
  windows: [30, 60, 90, 150]
  optional_windows: [300]
  causal: true
  primary_metric: macro_f1
  splits: leave_one_video_out
  seeds: [42, 123, 456, 789, 2026]

outputs:
  metrics: "fase_2/outputs/metrics/G48"
  figures: "fase_2/outputs/figures/G48"
  models: "fase_2/outputs/models/G48"
  predictions: "fase_2/outputs/predictions/G48"
  logs: "fase_2/outputs/logs/G48"
  cache: "fase_2/outputs/cache/G48"

