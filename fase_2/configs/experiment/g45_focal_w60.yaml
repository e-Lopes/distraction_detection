experiment_name: "g45_focal_r0_w60"
generation: "G45"
configuration_id: "focal_r0_w60"
intervention: "focal_loss"
representation: "R0"
window_size_frames: 60
preprocessing_config: "fase_2/configs/preprocessing/baseline_zero_fill.yaml"
models: [lstm, tcn]
seeds: [42]
evaluation_subsets: [validation]

training:
  max_epochs: 150
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  monitor: "val_macro_f1"
  mode: "max"
  patience: 15
  minimum_delta: 0.002
  checkpoint_every_epochs: 10
  gradient_clip_norm: 1.0
  amp: true
  deterministic: true
  num_workers: 0
  balancing: "none"
  loss: "focal"
  focal_gamma: 2.0
  focal_alpha: "N/(3*N_c)_train_only"
  focal_reduction: "sum_weighted_loss/sum_alpha_y"

parameters:
  lstm: {hidden_dim: 64, num_layers: 2, bidirectional: false, dropout: 0.25, pooling: "last"}
  tcn: {channels: [32, 64, 64], kernel_size: 3, dropout: 0.25, pooling: "mean"}
