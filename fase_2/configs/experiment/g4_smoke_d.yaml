experiment_name: "g4_smoke_d"
generation: "G4SMOKE"
configuration_id: "g4_smoke_d"
scenario: "D"
representation: "R0"
window_size_frames: 60
preprocessing_config: "fase_2/configs/preprocessing/baseline_zero_fill.yaml"
models: [tcn]
seeds: [42]
max_samples_per_subset: 64
augmentation_seed: 42
augmentation:
