  jitter_std: {ear: 0.005, mar: 0.005, pitch: 0.5, yaw: 0.5, roll: 0.5}
  masking_probability: 0.5
  max_mask_frames: 3
training: {max_epochs: 2, batch_size: 32, learning_rate: 0.001, weight_decay: 0.0001, monitor: "val_macro_f1", mode: "max", patience: 1, minimum_delta: 0.002, checkpoint_every_epochs: 1, gradient_clip_norm: 1.0, amp: true, deterministic: true, num_workers: 0, balancing: "augmentation"}
parameters:
  tcn: {channels: [32, 64, 64], kernel_size: 3, dropout: 0.25, pooling: "mean"}
