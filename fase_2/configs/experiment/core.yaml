experiment_name: "core_temporal_comparison"
data_config: "configs/data/base.yaml"
split_config: "configs/splits/leave_one_video_out.yaml"
preprocessing_configs:
  - "configs/preprocessing/baseline_zero_fill.yaml"
  - "configs/preprocessing/interpolation_flags.yaml"
models: [fixed_rules, xgboost, lstm, tcn]
optional_models: [random_forest, svm, transformer]
primary_metric: "macro_f1"
secondary_metrics:
  - "per_class_precision"
  - "per_class_recall"
  - "per_class_f1"
  - "balanced_accuracy"
  - "false_alarms_per_hour"
seeds: [13, 42, 77]

