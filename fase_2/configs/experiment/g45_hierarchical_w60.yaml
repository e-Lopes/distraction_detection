experiment_name: "g45_hierarchical_b_w60"
generation: "G45"
configuration_id: "hierarchical_b_w60"
representation: "R0"
window_size_frames: 60
preprocessing_config: "fase_2/configs/preprocessing/baseline_zero_fill.yaml"
models: [svm, lstm]
seeds: [42]
evaluation_subsets: [validation]

training:
  max_epochs: 150
  batch_size: 1024
  learning_rate: 0.001
  weight_decay: 0.0001
  monitor: "val_macro_f1"
  mode: "max"
  patience: 15
  minimum_delta: 0.002
  checkpoint_every_epochs: 10
  gradient_clip_norm: 1.0
  amp: true
  deterministic: true
  num_workers: 0
  balancing: "class_weights"

parameters:
  svm: {C: 1.0, kernel: "linear", probability: true, random_state: 42}
  lstm: {hidden_dim: 64, num_layers: 2, bidirectional: false, dropout: 0.25, pooling: "last"}
