[project]
name = "teleop-fatigue-distraction"
version = "0.1.0"
description = "Temporal fatigue and distraction detection for heavy machinery teleoperation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26,<2",
  "pandas",
  "scikit-learn",
  "pyyaml",
  "xgboost",
  "matplotlib",
  "seaborn",
  "opencv-python-headless>=4.10,<5",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
# 0.10.35 removeu a API legada ``mp.solutions`` usada pelo extrator canonico.
extraction = ["mediapipe>=0.10.18,<=0.10.21"]
temporal = ["torch>=2.5,<3"]
explainability = ["shap"]
g47 = ["mediapipe>=0.10.18,<=0.10.21", "ultralytics==8.4.115", "psutil"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
