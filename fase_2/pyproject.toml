[project]
name = "teleop-fatigue-distraction"
version = "0.1.0"
description = "Temporal fatigue and distraction detection for heavy machinery teleoperation"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "pyyaml",
  "torch",
  "xgboost",
  "matplotlib",
  "seaborn",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
explainability = ["shap"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

